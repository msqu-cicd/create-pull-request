---
name: "Create PR"
description: 'Commit and create PR'
inputs:
  base:
    description: 'Base branch to create PR against'
    required: true
    default: 'main'
  token:
    description: 'PAT for creating PR'
    required: true
  add-paths:
    description: 'Paths to add to commit'
    required: false
    default: '.'
  add-patterns:
    description: 'Patterns to add to commit'
    required: false
    default: '*'
  commit-message:
    description: 'Commit message'
    required: false
    default: 'Automated commit'
  pr-branch:
    description: 'Branch to create PR from'
    required: false
    default: 'automated-pr'
  pr-title:
    description: 'PR title'
    required: false
    default: 'Automated PR'
  pr-body:
    description: 'PR body'
    required: false
    default: 'Automated PR'
  pr-condition-cmd:
    description: 'Command to check if PR should be created'
    required: false
    default: git status --porcelain
  pr-assignee:
    description: 'Default assignee for the Pull request'
    required: false
    default: ''
  pr-automerge:
    description: 'Whether to automatically merge the Pull Request'
    required: false
    default: 'false'
  commit-user:
    description: 'Username to use for commit'
    required: false
    default: 'Forgejo Bot'
  commit-email:
    description: 'Email to use for commit'
    required: false
    default: 'forgejo-bot@noreply.localhost'

outputs:
  pr-number:
    description: 'Number of the created pull request'
    value: ${{ steps.commit.outputs.pr_number }}

runs:
  using: "composite"
  steps:
    - name: "Configure git"
      shell: bash
      env:
        COMMIT_USER: ${{ inputs.commit-user }}
        COMMIT_EMAIL: ${{ inputs.commit-email }}
      run: |
        git config user.name "$COMMIT_USER"
        git config user.email "$COMMIT_EMAIL"
    - name: "Pre-setup"
      shell: bash
      env:
        PR_BRANCH: ${{ inputs.pr-branch }}
      run: |
        git fetch --all
        git checkout -B "$PR_BRANCH"
    - name: "Check changes"
      id: git
      shell: bash
      env:
        PR_CONDITION_CMD: ${{ inputs.pr-condition-cmd }}
      run: |
        if [[ -n "$(bash -c "$PR_CONDITION_CMD")" ]]; then
          echo changes=true >> $GITHUB_OUTPUT
        else
          echo changes=false >> $GITHUB_OUTPUT
        fi
    - name: "Commit and create PR"
      if: steps.git.outputs.changes == 'true'
      id: commit
      shell: bash
      env:
        REPO: ${{ github.repository }}
        TOKEN: ${{ inputs.token }}
        ADD_PATHS: ${{ inputs.add-paths }}
        ADD_PATTERNS: ${{ inputs.add-patterns }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        PR_BRANCH: ${{ inputs.pr-branch }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY: ${{ inputs.pr-body }}
        PR_BASE: ${{ inputs.base }}
        PR_ASSIGNEE: ${{ inputs.pr-assignee }}
      run: |
        set -f
        git add -- $ADD_PATHS $ADD_PATTERNS
        set +f
        if git diff --cached --quiet; then
          echo "Nothing staged within the given paths, skipping PR creation"
          exit 0
        fi
        git commit -m "$COMMIT_MESSAGE"
        git push --force-with-lease origin "$PR_BRANCH"
        payload=$(jq -n \
          --arg assignee "$PR_ASSIGNEE" \
          --arg base "$PR_BASE" \
          --arg body "$PR_BODY" \
          --arg head "$PR_BRANCH" \
          --arg title "$PR_TITLE" \
          '{assignee: $assignee, base: $base, body: $body, head: $head, title: $title}')
        echo "URL:  $GITHUB_SERVER_URL/api/v1/repos/$REPO/pulls"
        if ! response=$(curl -s -S --fail-with-body -X 'POST' \
          "$GITHUB_SERVER_URL/api/v1/repos/$REPO/pulls" \
          -H 'accept: application/json' \
          -H @- \
          -H 'Content-Type: application/json' \
          -d "$payload" <<<"Authorization: token $TOKEN"); then
          echo "PR creation failed:"
          echo "$response"
          exit 1
        fi
        pr_number=$(jq -r '.number' <<<"$response")
        if [[ -z "$pr_number" || "$pr_number" == 'null' ]]; then
          echo "No PR number in the API response:"
          echo "$response"
          exit 1
        fi
        echo "PR Number: $pr_number"
        echo "pr_number=$pr_number" >> $GITHUB_OUTPUT
    - name: "Auto merge PR"
      shell: bash
      if: inputs.pr-automerge == 'true' && steps.git.outputs.changes == 'true' && steps.commit.outputs.pr_number != '' && steps.commit.outputs.pr_number != 'null'
      env:
        PR_NUMBER: ${{ steps.commit.outputs.pr_number }}
        REPO: ${{ github.repository }}
        TOKEN: ${{ inputs.token }}
      run: |
          echo "Setting auto merge for PR $PR_NUMBER"
          echo "URL: $GITHUB_SERVER_URL/api/v1/repos/$REPO/pulls/$PR_NUMBER/merge"
          if ! response=$(curl -s -S --fail-with-body -X 'POST' \
            "$GITHUB_SERVER_URL/api/v1/repos/$REPO/pulls/$PR_NUMBER/merge" \
            -H 'accept: application/json' \
            -H @- \
            -H 'Content-Type: application/json' \
            -d '{
            "Do": "squash",
            "merge_when_checks_succeed": true,
            "delete_branch_after_merge": true
            }' <<<"Authorization: token $TOKEN"); then
            echo "Auto merge failed:"
            echo "$response"
            exit 1
          fi
          echo "$response"
branding:
  icon: 'check'
  color: 'blue'
